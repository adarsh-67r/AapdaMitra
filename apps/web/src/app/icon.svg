<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The browser-tab version of BrandMark.tsx. Same pulse trace, same
       bordered square. It cannot read the theme's custom properties from
       inside a favicon, so the colours are the dark theme's literals:
       #14120f paper-black and the #e0574a accent, which stays legible at
       16px against light and dark browser chrome alike. Keep in step with
       the accent token in globals.css. -->
  <rect width="32" height="32" rx="7" fill="#14120f"/>
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="6" fill="none" stroke="#e0574a" stroke-width="1.5" opacity="0.55"/>
  <path d="M5 16.5h4l2.6-8 4.6 15.5 2.6-7.5H27"
        fill="none" stroke="#e0574a" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
