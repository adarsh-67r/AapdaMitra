services:
  - type: web
    name: aapdamitra-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INGEST_SECRET
        sync: false
      # Shared secret the SMS gateway presents on /sms/inbound. Unset means the
      # endpoint refuses everything, which is the safe default for a route that
      # is open to the internet by necessity.
      - key: SMS_INBOUND_KEY
        sync: false
